name: Actualizar Datos de Playas

on:
  workflow_dispatch:
    inputs:
      playas:
        description: 'Slugs de playas separados por comas (o "all" para todas)'
        required: true
        default: 'playa-de-san-juan,playa-del-postiguet,playa-de-la-solsida,cala-del-mascarat,playa-del-espigo'

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Ejecutar pipeline de datos
        run: |
          cd playas-datos
          
          ONLY_FLAG=""
          if [ "${{ github.event.inputs.playas }}" != "all" ]; then
            ONLY_FLAG="--only ${{ github.event.inputs.playas }}"
          fi
          
          echo "🏖️  Actualizando datos de playas..."
          echo "Playas: ${{ github.event.inputs.playas }}"
          
          # Ejecutar cada script del pipeline
          node scripts/coordenadas.mjs --in data/beaches-master.json --out data/sources/coordenadas.json $ONLY_FLAG || true
          node scripts/guia-playas.mjs --in data/beaches-master.json --out data/sources/guia-playas.json $ONLY_FLAG || true
          node scripts/censo-aguas-bano.mjs --in data/beaches-master.json --out data/sources/censo-aguas-bano.json $ONLY_FLAG || true
          node scripts/calidad-agua.mjs --in data/beaches-master.json --out data/sources/calidad-agua.json $ONLY_FLAG || true
          node scripts/bandera-azul.mjs --in data/beaches-master.json --out data/sources/bandera-azul.json $ONLY_FLAG || true
          node scripts/osm-servicios.mjs --in data/beaches-master.json --out data/sources/osm-servicios.json $ONLY_FLAG || true
          node scripts/clima-agua.mjs --in data/beaches-master.json --out data/sources/clima-agua.json $ONLY_FLAG || true
          node scripts/cercanas.mjs --in data/beaches-master.json --out data/sources/cercanas.json $ONLY_FLAG || true
          node scripts/montar-fichas.mjs --in data/beaches-master.json $ONLY_FLAG || true
          
          echo "✅ Pipeline completado"
      
      - name: Mostrar informe de completitud
        run: |
          cd playas-datos
          if [ -f data/informe-completitud.md ]; then
            echo "📊 Informe de Completitud:"
            cat data/informe-completitud.md
          fi
      
      - name: Commit y push de resultados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add playas-datos/data/
          
          if git diff --staged --quiet; then
            echo "No hay cambios para commitear"
          else
            PLAYAS_INPUT="${{ github.event.inputs.playas }}"
            if [ "$PLAYAS_INPUT" = "all" ]; then
              COMMIT_MSG="Actualizar datos de todas las playas"
            else
              COMMIT_MSG="Actualizar datos de playas: $PLAYAS_INPUT"
            fi
            
            git commit -m "$COMMIT_MSG [skip ci]"
            git push
            
            echo "✅ Cambios commiteados y pusheados"
          fi
